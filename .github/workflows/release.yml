name: Release

# A pushed tag is the whole trigger. PCFHub's contract is that tagging a
# component repository publishes a documented version on the hub with no manual
# steps, and this workflow is the half of that contract living here.
#
# The steps live in pcfhub/_template's reusable workflow. They used to live here
# as a ~130-line copy, and the copy had already drifted from the template's: it
# hard-coded two solution filenames and never checked the bundle against
# Dataverse's 5 MB web resource limit, so a control that grew past it would have
# shipped a release nobody could import. Neither gap was a decision. They were
# what a second copy of a build script becomes.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release'
        required: true

permissions:
  contents: write

jobs:
  release:
    uses: pcfhub/_template/.github/workflows/release-reusable.yml@v1
    with:
      control-dir: CodeEditor
      solution-dir: CodeEditorSolution
      tag: ${{ github.event.inputs.tag }}
      # Left alone, unlike the template's default.
      #
      # msbuild produces `CodeEditorSolution.zip`, and this repository's
      # pcfhub.json declares that exact name. Renaming it to *_unmanaged.zip
      # would read better and would break the unmanaged download on v1.0.0
      # through v1.0.2, whose published assets cannot be renamed after the fact
      # — the hub reads pcfhub.json from the default branch rather than from
      # each tag, so one set of patterns has to match every release this repo
      # has ever cut. Consistency across all of them beats a clearer filename on
      # the newest one.
      rename-unmanaged: false
