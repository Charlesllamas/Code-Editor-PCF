name: Build

# Every push and pull request, not only tags. release.yml runs on a tag alone,
# which meant a break could sit on main for days and only surface while somebody
# was waiting to ship. The bundled-Monaco work found a failure that reproduced
# *only* in a production build — see the buildMode step below.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Windows, not Linux. The solution is packed by msbuild through
    # Microsoft.PowerApps.MSBuild.Solution, a .NET Framework toolchain — there
    # is no Linux runner that can produce the zip.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: microsoft/setup-msbuild@v2

      - name: Install dependencies
        run: npm ci

      - name: Build the control
        run: npm run build

      # A development build tolerates things a production build does not. This
      # control cannot be bundled without `module.parser.javascript.worker =
      # false` in webpack.config.js, and without it a production build fails
      # with "RuntimeIdRuntimeModule must be in a single runtime" while the
      # development build succeeds and quietly emits unusable worker chunks.
      # Building both is the only way that stays caught.
      - name: Build the control (production)
        run: npx pcf-scripts build --buildMode production

      # The bundle is a single web resource and Dataverse rejects one larger
      # than 5 MB by default. Monaco puts this control close enough to that
      # ceiling that an added grammar or language service could cross it, and
      # the failure would otherwise appear as a solution import error in
      # somebody's environment rather than here.
      - name: Check the bundle fits a default environment
        shell: pwsh
        run: |
          $limit = 5242880
          $bundle = Get-ChildItem out/controls -Filter bundle.js -Recurse | Select-Object -First 1
          if (-not $bundle) { throw "No bundle.js under out/controls." }
          Write-Host "bundle.js is $($bundle.Length) bytes (limit $limit)"
          if ($bundle.Length -gt $limit) {
            throw "bundle.js is $($bundle.Length) bytes, over the $limit default Dataverse web resource limit."
          }

      # Packing on every push, not only on a tag. A solution that only fails to
      # pack at release time fails while somebody is waiting to ship it, and the
      # cause is usually a change made days earlier.
      - name: Pack the solution
        run: msbuild /t:build /restore /p:configuration=Release
        working-directory: CodeEditorSolution
