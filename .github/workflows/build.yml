name: Build

# The steps live in build-reusable.yml, shared by every component repository, so
# a fix to the build reaches all of them instead of the one that happened to be
# edited. What stays here is only what differs between repositories.
#
# Pinned to @v1 rather than @main — a build that can change without
# warning is one you cannot bisect. The shared workflow lives in
# pcfhub/_template; open an issue there rather than forking a copy back
# into this repository, which is the drift it was built to end.
#
# Every input it takes defaults to the strict value. If this repository
# ever needs to skip a step — no dev/ directory, so no smoke suite —
# say so here with a comment, where a reader will find it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: pcfhub/_template/.github/workflows/build-reusable.yml@v1
    with:
      # This repository predates the template and was brought into the fold by
      # adopt.mjs, which adds the hub contract but not scripts/ and not a dev
      # rig. So three of the shared build's steps have nothing to run here:
      #
      #   check-template  no scripts/check-template.mjs, so no placeholder gate
      #   lint            no lint script in package.json
      #   smoke           no dev/ directory, so no assertions at all
      #
      # check-template and lint are a piece of work, not a decision: adding
      # scripts/check-template.mjs and a lint script is what lets those two go.
      check-template: false
      lint: false
      # smoke is different, and it is not going away.
      #
      # The shared rig drives the built bundle in Node against dev/dom.js, a
      # deliberately small shim implementing what PCF controls actually touch.
      # This control mounts Monaco, which is a browser application: the bundle
      # does not merely fail to render there, it fails to *load*, throwing on
      # `document.getElementsByTagName` at module scope before any control code
      # runs (measured 2026-08-28 against the 15 MB production bundle).
      #
      # Adding that one method gets to the next missing API, and the one after.
      # Making the shim big enough for Monaco means writing a browser, which is
      # the thing dom.js says in its own header that it will not do. The honest
      # options are jsdom as a devDependency, or accepting that this control is
      # verified by being used rather than by assertion. Neither is a line in
      # this file.
      smoke: false
      # msbuild's project lives here rather than in Solution/.
      solution-dir: CodeEditorSolution
