name: Build

# The steps live in build-reusable.yml, shared by every component repository, so
# a fix to the build reaches all of them instead of the one that happened to be
# edited. What stays here is only what differs between repositories.
#
# Pinned to @v1 rather than @main — a build that can change without
# warning is one you cannot bisect. The shared workflow lives in
# pcfhub/_template; open an issue there rather than forking a copy back
# into this repository, which is the drift it was built to end.
#
# Every input it takes defaults to the strict value. If this repository
# ever needs to skip a step — no dev/ directory, so no smoke suite —
# say so here with a comment, where a reader will find it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: pcfhub/_template/.github/workflows/build-reusable.yml@v1
    with:
      # Every step runs here as of 1.2.0. Until then this file switched three
      # of them off — check-template, lint and smoke — and the reasons are
      # worth keeping because two of them were work and one was a decision:
      #
      #   check-template  had no scripts/check-template.mjs — copied in.
      #   lint            had no lint script and the stock pac-init ESLint
      #                   config, which fails on `ComponentFramework` itself —
      #                   replaced with the template's.
      #   smoke           "not going away": Monaco reads `document` at module
      #                   scope, so the bundle cannot load against dev/dom.js
      #                   (measured 2026-08-28). Still true. What changed is
      #                   what the suite drives: the control's decisions now
      #                   live in modules that import nothing of Monaco, and
      #                   dev/smoke.js transpiles and asserts those. Read its
      #                   header before assuming it covers what a sibling's
      #                   does — it proves the decision, not the wiring.
      #
      # msbuild's project lives here rather than in Solution/.
      solution-dir: CodeEditorSolution
